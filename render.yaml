databases:
  - name: csp-db
    plan: basic-256mb
    region: ohio
    databaseName: csp
    user: csp

services:
  - type: web
    name: chapter-strategic-planning
    runtime: node
    plan: starter
    region: ohio
    buildCommand: npm install --omit=dev
    startCommand: node server.js
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: csp-db
          property: connectionString
      - key: SESSION_SECRET
        generateValue: true
      - key: ADMIN_EMAILS
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: ANTHROPIC_MODEL
        value: claude-sonnet-5
